; =============================================================================
; Receptor RF - Proyecto PlatformIO
; Placa: Arduino Pro Mini (ATmega328, 5V, 16 MHz)
; =============================================================================

; Entorno principal: firmware del receptor
[env:firmware]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
src_dir = src
lib_deps = tmrh20/RF24@^7.3
; Librerías propias compartidas con el transmisor (ProtocoloRF)
lib_extra_dirs = ../libraries

; ---- Tests ----

; Ejemplo GettingStarted de la librería RF24 (cambia rol TX/RX
; desde el monitor serie: 'T' transmite, 'R' recibe)
[env:test-getting-started]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
src_dir = tests/getting_started
lib_deps = tmrh20/RF24@^7.3
