; =============================================================================
; Receptor RF - Proyecto PlatformIO
; Placa: Arduino Pro Mini (ATmega328, 5V, 16 MHz)
;
; Nota: en PlatformIO 6.x el directorio de fuentes (src_dir) se define en la
; sección [platformio] (por defecto "src"), no por entorno. El test vive en
; src/tests/ y se selecciona con build_src_filter.
; =============================================================================

; Entorno principal: firmware del receptor
[env:firmware]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_deps = nrf24/RF24
; Librerías propias compartidas con el transmisor (ProtocoloRF)
lib_extra_dirs = ../libraries
; Compilar solo el firmware (excluir los tests)
build_src_filter = +<main.cpp>

; ---- Tests ----

; Ejemplo GettingStarted de la librería RF24 (cambia rol TX/RX
; desde el monitor serie: 'T' transmite, 'R' recibe)
[env:test-getting-started]
platform = atmelavr
board = pro16MHzatmega328
framework = arduino
lib_deps = nrf24/RF24
build_src_filter = +<tests/getting_started.cpp>
