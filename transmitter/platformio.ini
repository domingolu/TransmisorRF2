; =============================================================================
; Transmisor RF - Proyecto PlatformIO
; Placa: Arduino Nano (ATmega328, 5V, 16 MHz, nuevo bootloader)
;
; Nota: en PlatformIO 6.x el directorio de fuentes (src_dir) se define en la
; sección [platformio] (por defecto "src"), no por entorno. Cada test vive en
; src/tests/ y se selecciona con build_src_filter.
; =============================================================================

; Entorno principal: firmware del transmisor
[env:firmware]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
  nrf24/RF24
  arduinogetstarted/ezButton
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
; Librerías propias compartidas con el receptor (ProtocoloRF)
lib_extra_dirs = ../libraries
; Compilar solo el firmware (excluir los tests)
build_src_filter = +<main.cpp>
monitor_speed = 115200

; ---- Simulación en Wokwi ----
; Wokwi no tiene parte oficial para el nRF24L01+, así que este entorno
; usa un stub local de la librería RF24 (wokwi-lib/RF24) que implementa
; solo la API que usa el firmware. El firmware real (src/main.cpp) se
; compila sin cambios: lo que se simula es la lectura de los mandos y
; el mapeo de los 10 canales, no el enlace RF.
; Diagramas y configuración: diagram.json y wokwi.toml (en esta carpeta).
[env:wokwi]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
  arduinogetstarted/ezButton
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
; ProtocoloRF (compartido con el receptor) + stub local de RF24
lib_extra_dirs =
  ../libraries
  wokwi-lib
build_src_filter = +<main.cpp>
monitor_speed = 115200

; ---- Tests de hardware (uno por componente) ----

; Test de 4 botones con antirrebote (ezButton), pines D5-D8
[env:test-botones]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps = arduinogetstarted/ezButton
build_src_filter = +<tests/botones.cpp>
monitor_speed = 9600

