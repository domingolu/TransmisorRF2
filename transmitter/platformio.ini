; =============================================================================
; Transmisor RF - Proyecto PlatformIO
; Placa: Arduino Nano (ATmega328, 5V, 16 MHz)
;
; Nota: en PlatformIO 6.x el directorio de fuentes (src_dir) se define en la
; sección [platformio] (por defecto "src"), no por entorno. Cada test vive en
; src/tests/ y se selecciona con build_src_filter.
; =============================================================================

; Entorno principal: firmware del transmisor
[env:firmware]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  nrf24/RF24
  arduinogetstarted/ezButton
; Librerías propias compartidas con el receptor (ProtocoloRF)
lib_extra_dirs = ../libraries
; Compilar solo el firmware (excluir los tests)
build_src_filter = +<main.cpp>

; ---- Tests de hardware (uno por componente) ----

; Test de 4 botones con antirrebote (ezButton), pines D5-D8
[env:test-botones]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = arduinogetstarted/ezButton
build_src_filter = +<tests/botones.cpp>

; Test de dos joysticks con botón (librería propia Joystick)
[env:test-joystick]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = arduinogetstarted/ezButton
build_src_filter = +<tests/joystick.cpp>

; Test de dos potenciómetros (P1 -> A7, P2 -> A6)
[env:test-potenciometros]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = +<tests/potenciometros.cpp>

; Test de dos switches (L1 -> D3, L2 -> D4, INPUT_PULLUP)
[env:test-switches]
platform = atmelavr
board = nanoatmega328
framework = arduino
build_src_filter = +<tests/switches.cpp>

; Test de pantalla OLED SSD1306 128x32 por I2C
[env:test-pantalla-32]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_src_filter = +<tests/pantalla_32.cpp>

; Test de pantalla OLED SSD1306 128x64 por I2C
[env:test-pantalla-64]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_src_filter = +<tests/pantalla_64.cpp>

; Demo de la librería propia Pantalla ("Hello Word" centrado + esquinas)
[env:test-pantalla-lib]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps =
  adafruit/Adafruit GFX Library
  adafruit/Adafruit SSD1306
build_src_filter = +<tests/pantalla_lib.cpp>

; Ejemplo GettingStarted de la librería RF24 (cambia rol TX/RX
; desde el monitor serie: 'T' transmite, 'R' recibe)
[env:test-getting-started]
platform = atmelavr
board = nanoatmega328
framework = arduino
lib_deps = nrf24/RF24
build_src_filter = +<tests/getting_started.cpp>
