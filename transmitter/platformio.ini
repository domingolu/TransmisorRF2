; =============================================================================
; Transmisor RF - Proyecto PlatformIO
; Placa: Arduino Nano (ATmega328, 5V, 16 MHz)
; =============================================================================

; Entorno principal: firmware del transmisor
[env:firmware]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = src
lib_deps =
  tmrh20/RF24@^7.3
  newbiely/ezButton@^2.0
; Librerías propias compartidas con el receptor (ProtocoloRF)
lib_extra_dirs = ../libraries

; ---- Tests de hardware (uno por componente) ----

; Test de 4 botones con antirrebote (ezButton), pines D5-D8
[env:test-botones]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/botones
lib_deps = newbiely/ezButton@^2.0

; Test de dos joysticks con botón (librería propia Joystick)
[env:test-joystick]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/joystick
lib_deps = newbiely/ezButton@^2.0

; Test de dos potenciómetros (P1 -> A7, P2 -> A6)
[env:test-potenciometros]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/potenciometros

; Test de dos switches (L1 -> D3, L2 -> D4, INPUT_PULLUP)
[env:test-switches]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/switches

; Test de pantalla OLED SSD1306 128x32 por I2C
[env:test-pantalla-32]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/pantalla_32
lib_deps =
  adafruit/Adafruit GFX Library@^1.11
  adafruit/Adafruit SSD1306@^2.5

; Test de pantalla OLED SSD1306 128x64 por I2C
[env:test-pantalla-64]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/pantalla_64
lib_deps =
  adafruit/Adafruit GFX Library@^1.11
  adafruit/Adafruit SSD1306@^2.5

; Demo de la librería propia Pantalla ("Hello Word" centrado + esquinas)
[env:test-pantalla-lib]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/pantalla_lib
lib_deps =
  adafruit/Adafruit GFX Library@^1.11
  adafruit/Adafruit SSD1306@^2.5

; Ejemplo GettingStarted de la librería RF24 (cambia rol TX/RX
; desde el monitor serie: 'T' transmite, 'R' recibe)
[env:test-getting-started]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = tests/getting_started
lib_deps = tmrh20/RF24@^7.3
